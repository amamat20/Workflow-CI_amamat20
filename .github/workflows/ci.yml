# ============================================================
# ci.yml — GitHub Actions Workflow untuk MLflow CI
# Trigger: setiap push ke branch main
# ============================================================

name: MLflow CI — Student Performance

on:
  push:
    branches: [ main ]
  workflow_dispatch:    # bisa trigger manual dari GitHub UI

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout repo ──────────────────────────────
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      # ── Step 2: Setup Python ───────────────────────────────
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      # ── Step 3: Cek environment ────────────────────────────
      - name: Check Env
        run: |
          python --version
          pip --version

      # ── Step 4: Install dependencies ──────────────────────
      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn pandas numpy \
                      matplotlib seaborn

      # ── Step 5: Set MLflow Tracking URI ───────────────────
      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=./mlruns" >> $GITHUB_ENV

      # ── Step 6: Run MLflow project ────────────────────────
      - name: Run mlflow project
        run: |
          cd MLProject
          mlflow run . --env-manager=local

      # ── Step 7: Install Google Drive dependencies ─────────
      - name: Install Python dependencies
        run: |
          pip install google-auth google-auth-oauthlib \
                      google-auth-httplib2 google-api-python-client

      # ── Step 8: Upload artefak ke Google Drive ────────────
      - name: Upload to Google Drive
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID:   ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python - <<'EOF'
          import os, json, glob, shutil
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          # ── Load credentials ────────────────────────────────
          creds_json = os.environ['GDRIVE_CREDENTIALS']
          folder_id  = os.environ['GDRIVE_FOLDER_ID'].strip()

          print(f"📁 Target folder ID: {folder_id}")

          creds_dict = json.loads(creds_json)
          creds = service_account.Credentials.from_service_account_info(
              creds_dict,
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=creds)

          # ── Verifikasi folder bisa diakses ──────────────────
          try:
              folder = service.files().get(
                  fileId=folder_id,
                  fields='id, name'
              ).execute()
              print(f"✅ Folder ditemukan: {folder.get('name')}")
          except Exception as e:
              print(f"❌ Folder tidak bisa diakses: {e}")
              print("Pastikan:")
              print("  1. Folder ID benar")
              print("  2. Service account sudah di-share ke folder")
              raise

          # ── Buat zip mlruns ─────────────────────────────────
          files_to_upload = []

          if os.path.exists('MLProject/mlruns'):
              shutil.make_archive(
                  'mlruns_artifact', 'zip',
                  'MLProject', 'mlruns'
              )
              files_to_upload.append('mlruns_artifact.zip')
              print("✅ mlruns di-zip")

          # Tambahkan confusion matrix jika ada
          cm_path = 'MLProject/confusion_matrix.png'
          if os.path.exists(cm_path):
              files_to_upload.append(cm_path)

          print(f"📦 File yang akan diupload: {files_to_upload}")

          # ── Upload satu per satu ─────────────────────────────
          uploaded = 0
          for fpath in files_to_upload:
              if not os.path.isfile(fpath):
                  print(f"⚠️  Skip (tidak ada): {fpath}")
                  continue

              fname = os.path.basename(fpath)
              meta  = {'name': fname, 'parents': [folder_id]}

              # Tentukan mimetype
              if fpath.endswith('.zip'):
                  mimetype = 'application/zip'
              elif fpath.endswith('.png'):
                  mimetype = 'image/png'
              else:
                  mimetype = 'application/octet-stream'

              media = MediaFileUpload(
                  fpath,
                  mimetype  = mimetype,
                  resumable = True
              )

              try:
                  result = service.files().create(
                      body       = meta,
                      media_body = media,
                      fields     = 'id, name'
                  ).execute()
                  print(f"✅ Uploaded: {fname} (id: {result.get('id')})")
                  uploaded += 1
              except Exception as e:
                  print(f"❌ Gagal upload {fname}: {e}")

          print(f"\n✅ Total berhasil diupload: {uploaded} file")
          EOF